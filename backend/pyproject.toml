
[project]
name = "live-translation-benchmark"
version = "0.1.0"
description = "Benchmark for live speech translation models"
requires-python = ">=3.11"

dependencies = [
    # Per-client timeout_s and max_retries require the supported 1.33 SDK.
    "deepl>=1.33.0,<2.0",
    "numpy>=2.0,<3.0",
    # PostgreSQL driver for Supabase; binary includes native dependencies.
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "websocket-client>=1.9.2",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
# Canonical package: app; this directory is the backend import root.
pythonpath = ["."]
