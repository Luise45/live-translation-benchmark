[project]
name = "live-translation-benchmark"
version = "0.1.0"
description = "Benchmark for live speech translation models"
requires-python = ">=3.11"

dependencies = [
    "deepl>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "websocket-client>=1.9.2",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]