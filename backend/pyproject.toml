# Python project and dependency configuration.
#
# Belongs here:
# - backend runtime dependencies
# - development/test dependencies
# - supported Python version
#
# Provider-specific SDKs should only be added once the corresponding
# integration decision has been made.
#
# Do NOT store API keys or credentials here.

[project]
name = "live-translation-benchmark-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]