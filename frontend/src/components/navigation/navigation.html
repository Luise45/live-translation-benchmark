<header class="main-navigation">
  <div class="navigation-content">

    <span class="application-name">
      Live Translation Benchmark
    </span>

    <!-- 4 interfaces -->
    <nav
      class="navigation-links"
      aria-label="Hauptnavigation"
    >
      <a routerLink="/dashboard" routerLinkActive="active">
        Dashboard
      </a>

      <a routerLink="/runs" routerLinkActive="active">
        Runs
      </a>

      <a routerLink="/run-history" routerLinkActive="active">
        Run History
      </a>

      <a routerLink="/testsets" routerLinkActive="active">
        Testsets
      </a>
    </nav>

    <!-- Hilfe-Menü -->
    <div class="information-menu">
      <button
        type="button"
        class="information-button"
        aria-label="Hilfe-Menü öffnen"
        aria-haspopup="true"
        aria-controls="information-menu-options"
      >
        <!-- Fragezeichen im Kreis -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8C12.5 11.8 12 12.5 12 14"></path>
          <path d="M12 17h.01"></path>
        </svg>
      </button>

      <!-- dropdown ? -->
      <nav
        id="information-menu-options"
        class="information-menu-content"
        aria-label="Hilfe-Seiten"
      >
        <a routerLink="/help/tutorial" class="information-menu-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m2 9 10-5 10 5-10 5-10-5Z"></path>
            <path d="M6 12v5c4 3 8 3 12 0v-5"></path>
          </svg>

          <span>Tutorial</span>
        </a>

        <a routerLink="/help/about" class="information-menu-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v5"></path>
            <path d="M12 8h.01"></path>
          </svg>

          <span>Über das Tool</span>
        </a>
      </nav>
    </div>

  </div>
</header>
